[workspace]
members = [
    "crates/padbridge-core",
    "crates/padbridge-daemon",
    "crates/padbridge-cli",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.75"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread"] }
toml = "0.8"
tracing = "0.1"